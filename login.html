<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign-In | Amazon.com</title>
  <link rel="icon" type="image/png" href="Amazon_icon.png">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="container">
    <!-- Amazon Logo -->
    <div class="logo">
     <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Amazon Logo">
    </div>

    <!-- Login Box -->
    <div class="login-box">
      <h2>Sign-In</h2>
      <form>
        <label for="email">Email or mobile phone number</label>
        <input type="text" id="email" required placeholder="Enter your Email or mobile number">

        <button type="submit" class="btn">Continue</button>

        <p class="privacy">By continuing, you agree to Amazon's 
          <a href="#">Conditions of Use</a> and 
          <a href="#">Privacy Notice</a>.
        </p>
      </form>

      <div class="help">
        <a href="#">Need help?</a>
      </div>
    </div>

    <!-- Create Account -->
    <div class="create-box">
      <p>New to Amazon?</p>
      <button onclick="openPopup()">Create your Amazon account</button>
    </div>
  </div>

  <!-- Popup -->
  <div class="popup" id="popup">
    <div class="popup-content">
      <span class="close" onclick="closePopup()">&times;</span>
      <h3>Create Account</h3>
      <form>
        <input type="text" placeholder="Your name" required>
        <input type="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
<p id="error-msg" style="color:red; font-size:14px;"></p>
<button type="submit" class="btn">Create Account</button>

      </form>
    </div>
  </div>

  <!-- Back to Home -->
  <div class="back-home">
    <a href="index.html">← Back to Home</a>
  </div>

  <script>
    function openPopup() {
      document.getElementById("popup").style.display = "flex";
    }
    function closePopup() {
      document.getElementById("popup").style.display = "none";
    }
    // Select the create account form and elements
const createForm = document.querySelector("#popup form");
const passwordInput = document.getElementById("password");
const errorMsg = document.getElementById("error-msg");

createForm.addEventListener("submit", function(event) {
  // Check if password is more than 6 characters
  if (passwordInput.value.length <= 6) {
    event.preventDefault(); // Stop form submission
    errorMsg.textContent = "Password must be more than 6 characters!";
    passwordInput.focus();
  } else {
    errorMsg.textContent = ""; // Clear error
  }
});

  </script>
</body>
</html>
