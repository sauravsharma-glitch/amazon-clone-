<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prime Video – Watch Movies & TV Shows Online</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="icon" href="amazon-prime-logo-free-png.webp">
  <style>
    /* ===== Reset & Base ===== */
    body {
      margin: 0;
      font-family: "Amazon Ember", Arial, sans-serif;
      background-color: #0f171e;
      color: #fff;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* ===== 🎬 Fullscreen Background Video ===== */
    #bgVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      filter: brightness(0.5);
    }

    /* ===== Fixed Navbar ===== */
    .pv-navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 10px 40px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      z-index: 100;
    }

    /* ===== Navbar Logo ===== */
    .pv-navbar img {
      height: 60px;
      width: auto;
      object-fit: contain;
      margin-top: 2px;
    }

    /* ===== Navbar Links ===== */
    .pv-navbar .nav-links {
      display: flex;
      gap: 25px;
      font-size: 15px;
      align-items: center;
    }

    .pv-navbar .nav-links a:hover {
      color: #00a8e1;
    }

    /* ===== Navbar Right Side ===== */
    .pv-navbar .nav-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .pv-navbar button {
      background-color: #00a8e1;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }

    .pv-navbar button:hover {
      background-color: #0092c5;
    }

    /* ===== Hero Section ===== */
    .hero {
      position: relative;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }

    .hero-content {
      z-index: 1;
    }

    .hero h1 {
      font-size: 2.8rem;
      margin-bottom: 15px;
      text-shadow: 2px 2px 12px rgba(0,0,0,0.8);
    }

    .hero p {
      font-size: 1.2rem;
      margin-bottom: 20px;
    }

    .watch-btn, .info-btn {
      background-color: #00a8e1;
      color: #fff;
      padding: 12px 25px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
      margin: 8px;
    }

    .watch-btn:hover, .info-btn:hover {
      background-color: #007fa6;
      transform: scale(1.05);
    }

    /* ===== Movie Grid ===== */
    .movie-section {
      padding: 0px 60px 40px;
      background: rgba(0, 0, 0, 0.7);
    }

    .movie-section h2 {
      font-size: 1.8rem;
      margin-bottom: 20px;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .movie-card {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .movie-card img {
      width: 100%;
      height: 270px;
      object-fit: cover;
      border-radius: 8px;
    }

    .movie-card:hover {
      transform: scale(1.05);
    }

    /* ===== Footer ===== */
    footer {
      background-color: rgba(26, 36, 47, 0.9);
      text-align: center;
      padding: 25px 15px;
      color: #aaa;
      font-size: 14px;
      margin-top: 60px;
      backdrop-filter: blur(4px);
    }

    footer a {
      color: #00a8e1;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- 🎥 Fullscreen Background Video -->
  <video autoplay muted loop playsinline id="bgVideo">
    <source src="salar movie.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- ===== Navbar ===== -->
  <div class="pv-navbar">
    <div class="nav-left">
      <a href="Amazon Clone.html">
        <img src="https://upload.wikimedia.org/wikipedia/commons/f/f1/Prime_Video.png" alt="Prime Video Logo">
      </a>
    </div>

    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Movies</a>
      <a href="#">TV Shows</a>
      <a href="#">Kids</a>
      <a href="#">Sports</a>
    </div>

    <div class="nav-right">
      <button>Try Prime</button>
      <i class="fa-solid fa-user"></i>
    </div>
  </div>

  <!-- ===== Hero Section (with text only, no big logo) ===== -->
  <section class="hero">
    <div class="hero-content">
      <h1>Welcome to Prime Video</h1>
      <p>Watch popular movies, exclusive Amazon Originals, and hit TV shows — all in one place.</p>
      <button class="watch-btn">▶ Watch Now</button>
      <button class="info-btn">More Info</button>
    </div>
  </section>

  <!-- ===== Movie Rows ===== -->
  <section class="movie-section">
    <h2>Trending Now</h2>
    <div class="movie-grid">
      <div class="movie-card"><img src="https://m.media-amazon.com/images/I/71niXI3lxlL._AC_SY679_.jpg" alt=""></div>
      <div class="movie-card"><img src="https://m.media-amazon.com/images/I/71c05lTE03L._AC_SY679_.jpg" alt=""></div>
      <div class="movie-card"><img src="https://m.media-amazon.com/images/I/81t2CVWEsUL._AC_SY679_.jpg" alt=""></div>
      <div class="movie-card"><img src="movie6.avif" alt=""></div>
      <div class="movie-card"><img src="movie7.jpg" alt=""></div>
    </div>
  </section>

  <section class="movie-section">
    <h2>Amazon Originals</h2>
    <div class="movie-grid">
      <div class="movie-card"><img src="movie1.webp" alt=""></div>
      <div class="movie-card"><img src="movie2.jpg" alt=""></div>
      <div class="movie-card"><img src="movie3.jpeg" alt=""></div>
      <div class="movie-card"><img src="movie4.jpeg" alt=""></div>
      <div class="movie-card"><img src="movie5.webp" alt=""></div>
    </div>
  </section>
  <section class="movie-section">
    <h2>Most watched TV</h2>
    <div class="movie-grid">
      <div class="movie-card"><img src="movie8.jpg" alt=""></div>
      <div class="movie-card"><img src="movie9.webp" alt=""></div>
      <div class="movie-card"><img src="movie13.jpg" alt=""></div>
      <div class="movie-card"><img src="movie11.jpeg" alt=""></div>
      <div class="movie-card"><img src="movie12.jpg" alt=""></div>
    </div>
  </section>

  <!-- ===== Footer ===== -->
  <footer>
    <p>© 2025 Amazon Prime Video Clone | Built for learning purposes</p>
    <p><a href="Amazon Clone.html">← Back to Home</a></p>
  </footer>

</body>
</html>
